# Integração contínua: a cada push e a cada PR, confere formatação, lint, testes de unidade
# e testes de ponta a ponta (dois jobs que rodam em paralelo).
# Se algum passo falhar, o GitHub marca o commit/PR com um X vermelho.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# Um novo push na mesma branch cancela a execução anterior, que já ficou velha
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint e testes
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@v5

      - name: Instalar o Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm # reaproveita o cache do npm entre execuções

      - name: Instalar dependências
        run: npm ci # instala exatamente o que está no package-lock.json

      - name: Conferir formatação (Prettier)
        run: npm run format:check

      - name: Lint (ESLint)
        run: npm run lint

      - name: Testes (Vitest)
        run: npm test -- --run # --run executa uma vez, sem modo watch

      - name: Build
        run: npm run build

  e2e:
    name: Testes de ponta a ponta (Playwright)
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@v5

      - name: Instalar o Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Instalar o Chromium do Playwright
        run: npx playwright install --with-deps chromium

      - name: Testes de ponta a ponta
        run: npm run test:e2e

      # Se algo falhar, o relatório (com o passo a passo gravado) fica disponível para baixar na aba Actions
      - name: Guardar o relatório do Playwright
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
