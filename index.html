<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Painel interativo com população, PIB e PIB per capita dos estados brasileiros, com dados do IBGE."
    />
    <title>Brasil em Dados</title>
  </head>
  <body>
    <header class="site-header">
      <div class="container">
        <h1 class="site-title">Brasil em Dados</h1>
        <p class="site-subtitle">Indicadores socioeconômicos dos estados brasileiros · 2022</p>
      </div>
    </header>

    <main class="container">
      <section class="section" aria-labelledby="kpi-title">
        <h2 id="kpi-title" class="visually-hidden">Resumo do Brasil</h2>
        <div id="kpi-cards" class="kpi-grid"></div>
      </section>

      <div class="section charts-grid">
        <section class="panel" aria-labelledby="ranking-title">
          <h2 id="ranking-title" class="panel-title">Ranking dos estados</h2>
          <div class="chart-container chart-container--ranking">
            <canvas id="ranking-chart" role="img" aria-label="Gráfico de barras"></canvas>
          </div>
        </section>

        <section class="panel" aria-labelledby="region-title">
          <h2 id="region-title" class="panel-title">Participação das regiões</h2>
          <div class="chart-container chart-container--region">
            <canvas id="region-chart" role="img" aria-label="Gráfico de rosca"></canvas>
          </div>
          <ul id="region-legend" class="legend"></ul>
        </section>
      </div>

      <section class="section panel" aria-labelledby="table-title">
        <div class="table-toolbar">
          <h2 id="table-title" class="panel-title">Dados por estado</h2>
          <div class="search-field">
            <label for="state-search" class="visually-hidden">Buscar estado</label>
            <input
              id="state-search"
              class="search-input"
              type="search"
              placeholder="Buscar estado ou sigla"
              autocomplete="off"
            />
          </div>
        </div>
        <p id="table-count" class="table-count" aria-live="polite"></p>
        <div class="table-wrapper" tabindex="0" role="region" aria-labelledby="table-title">
          <table id="states-table" class="data-table">
            <thead></thead>
            <tbody></tbody>
          </table>
        </div>
      </section>

      <p id="status-message" class="status-message" role="alert" hidden></p>
    </main>

    <footer class="site-footer">
      <div class="container">
        <p>
          Fonte:
          <a href="https://servicodados.ibge.gov.br/api/docs" target="_blank" rel="noopener"
            >API de Serviço de Dados do IBGE</a
          >. PIB a preços correntes e população residente do Censo 2022.
        </p>
      </div>
    </footer>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
